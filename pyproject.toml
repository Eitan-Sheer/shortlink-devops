[project]
name = "shortlink"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Eitan Sheer", email = "eitansheer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.5",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shortlink = "shortlink:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]